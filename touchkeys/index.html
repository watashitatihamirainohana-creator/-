<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>touchkeys</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #000;
    position: fixed; inset: 0;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, system-ui, sans-serif;
  }
  #lanes { display: flex; position: fixed; inset: 0; }
  .lane {
    flex: 1; display: flex; align-items: flex-end; justify-content: center;
    box-sizing: border-box; border-left: 1px solid #333;
    background: #111; color: #777;
    font-size: 5vw; font-weight: 700; padding-bottom: 6vh;
    pointer-events: none;            /* タッチは全部 document で受ける */
  }
  .lane:first-child { border-left: 0; }
  .lane:nth-child(even) { background: #171717; }
  .lane.on { background: #2f7cf6; color: #fff; }
  #status {
    position: fixed; top: 0; left: 0; right: 0; padding: 6px;
    text-align: center; font-size: 14px; color: #fff; background: #b3261e;
    pointer-events: none;
  }
  #status.ok { display: none; }
</style>
</head>
<body>
<div id="lanes"></div>
<div id="status">接続中…</div>
<script>
(function () {
  var lanesEl = document.getElementById('lanes');
  var statusEl = document.getElementById('status');
  var cfg = null, els = [], counts = [];
  var touches = new Map();   // touch.identifier -> レーン番号
  var ws = null, out = [];

  // ---- 送信: 1 回のタッチイベントで出た分を 1 フレームにまとめる
  function flush() {
    if (out.length && ws && ws.readyState === 1) ws.send(out.join(' '));
    out.length = 0;
  }

  function laneAt(x) {
    var i = Math.floor(x / window.innerWidth * cfg.keys.length);
    return i < 0 ? 0 : i >= cfg.keys.length ? cfg.keys.length - 1 : i;
  }

  function press(i) {
    counts[i]++;
    if (counts[i] === 1) { out.push('d' + i); els[i].classList.add('on'); }
    else if (cfg.retrigger) out.push('r' + i);   // 押さえ中のレーンを別の指で叩いた → 打ち直す
  }

  function release(i) {
    if (counts[i] === 0) return;
    counts[i]--;
    if (counts[i] === 0) { out.push('u' + i); els[i].classList.remove('on'); }
  }

  function releaseAll() {
    touches.clear();
    for (var i = 0; i < counts.length; i++) {
      if (counts[i]) { counts[i] = 0; out.push('u' + i); els[i].classList.remove('on'); }
    }
    flush();
  }

  // iOS が touchend を落とした場合に備え、実在しない指を掃除する
  function reconcile(e) {
    if (touches.size <= e.touches.length) return;
    var alive = new Set();
    for (var k = 0; k < e.touches.length; k++) alive.add(e.touches[k].identifier);
    touches.forEach(function (lane, id) {
      if (!alive.has(id)) { touches.delete(id); release(lane); }
    });
  }

  function onStart(e) {
    e.preventDefault();
    if (!cfg) return;
    for (var k = 0; k < e.changedTouches.length; k++) {
      var t = e.changedTouches[k];
      if (touches.has(t.identifier)) release(touches.get(t.identifier));
      var i = laneAt(t.clientX);
      touches.set(t.identifier, i);
      press(i);
    }
    reconcile(e);
    flush();
  }

  function onMove(e) {
    e.preventDefault();
    if (!cfg || !cfg.slide) return;
    for (var k = 0; k < e.changedTouches.length; k++) {
      var t = e.changedTouches[k];
      var old = touches.get(t.identifier);
      if (old === undefined) continue;
      var i = laneAt(t.clientX);
      if (i !== old) { touches.set(t.identifier, i); release(old); press(i); }
    }
    flush();
  }

  function onEnd(e) {
    e.preventDefault();
    if (!cfg) return;
    for (var k = 0; k < e.changedTouches.length; k++) {
      var id = e.changedTouches[k].identifier;
      var i = touches.get(id);
      if (i === undefined) continue;
      touches.delete(id);
      release(i);
    }
    reconcile(e);
    flush();
  }

  var opt = { passive: false, capture: true };
  document.addEventListener('touchstart', onStart, opt);
  document.addEventListener('touchmove', onMove, opt);
  document.addEventListener('touchend', onEnd, opt);
  document.addEventListener('touchcancel', onEnd, opt);
  // ブラウザ標準のジェスチャー類を全部止める
  ['gesturestart', 'gesturechange', 'gestureend', 'contextmenu', 'selectstart',
   'dblclick', 'click', 'dragstart', 'wheel'].forEach(function (n) {
    document.addEventListener(n, function (e) { e.preventDefault(); }, opt);
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) releaseAll();
  });
  window.addEventListener('pagehide', releaseAll);

  function build() {
    lanesEl.textContent = '';
    els = []; counts = [];
    cfg.keys.forEach(function (k) {
      var d = document.createElement('div');
      d.className = 'lane';
      d.textContent = k.toUpperCase();
      lanesEl.appendChild(d);
      els.push(d); counts.push(0);
    });
    touches.clear();
  }

  function connect() {
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    ws.onmessage = function (m) {
      cfg = JSON.parse(m.data);
      build();
      statusEl.className = 'ok';
    };
    ws.onclose = function () {
      statusEl.className = '';
      statusEl.textContent = 'PC と未接続 — 再接続中…';
      if (cfg) releaseAll();
      setTimeout(connect, 500);
    };
    ws.onerror = function () { try { ws.close(); } catch (_) {} };
  }
  connect();
})();
</script>
</body>
</html>
