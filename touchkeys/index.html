<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>touchkeys</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #000;
    position: fixed; inset: 0;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, system-ui, sans-serif;
  }
  #lanes { display: flex; position: fixed; inset: 0; }
  .lane {
    flex: 1; display: flex; align-items: flex-end; justify-content: center;
    box-sizing: border-box; border-left: 1px solid #333;
    background: #111; color: #777;
    font-size: 5vw; font-weight: 700; padding-bottom: 6vh;
    flex-direction: column; justify-content: flex-end; align-items: center;
    pointer-events: none;            /* タッチは全部 document で受ける */
  }
  .lane:first-child { border-left: 0; }
  .lane:nth-child(even) { background: #171717; }
  .lane.on { background: #2f7cf6; color: #fff; }
  .lane small { font-size: 2.2vw; font-weight: 400; opacity: .7; }
  #status {
    position: fixed; top: 0; left: 0; right: 0; padding: 6px;
    text-align: center; font-size: 14px; color: #fff; background: #b3261e;
    pointer-events: none;
  }
  #status.ok { display: none; }
</style>
</head>
<body>
<div id="lanes"></div>
<div id="status">接続中…</div>
<script>
(function () {
  var lanesEl = document.getElementById('lanes');
  var statusEl = document.getElementById('status');
  var cfg = null, els = [], counts = [], seen = [], seenEls = [], rescued = [];
  var touches = new Map();   // touch.identifier -> レーン番号
  var ws = null, out = [];

  // ---- 送信: 1 回のタッチイベントで出た分を 1 フレームにまとめる
  function flush() {
    if (out.length && ws && ws.readyState === 1) ws.send(out.join(' '));
    out.length = 0;
  }

  function laneAt(x) {
    var i = Math.floor(x / window.innerWidth * cfg.keys.length);
    return i < 0 ? 0 : i >= cfg.keys.length ? cfg.keys.length - 1 : i;
  }

  // 診断: ブラウザが受け取った生イベントをそのまま PC に送る
  function dbg(type, id, lane, n) {
    if (cfg.debug && ws && ws.readyState === 1)
      ws.send('#' + type + ' id=' + id + ' lane=' + lane + ' n=' + n + ' t=' + performance.now().toFixed(1));
  }

  // 指 1 本ぶん: ID:x,y,接触半径,圧力
  function fmt(list) {
    var a = [];
    for (var k = 0; k < list.length; k++) {
      var t = list[k];
      a.push(t.identifier + ':' + Math.round(t.clientX) + ',' + Math.round(t.clientY) + ',r' +
             (t.radiusX || 0).toFixed(1) + ',f' + (t.force || 0).toFixed(2));
    }
    return a.join(' ');
  }

  function press(i) {
    seen[i]++;                            // 受け取った「触れた」回数 (+N は touchstart 抜けを拾った数)
    seenEls[i].textContent = seen[i] + (rescued[i] ? ' (+' + rescued[i] + ')' : '');
    counts[i]++;
    if (counts[i] === 1) { out.push('d' + i); els[i].classList.add('on'); }
    else if (cfg.retrigger) out.push('r' + i);   // 押さえ中のレーンを別の指で叩いた → 打ち直す
  }

  function release(i) {
    if (counts[i] === 0) return;
    counts[i]--;
    if (counts[i] === 0) { out.push('u' + i); els[i].classList.remove('on'); }
  }

  function releaseAll() {
    touches.clear();
    for (var i = 0; i < counts.length; i++) {
      if (counts[i]) { counts[i] = 0; out.push('u' + i); els[i].classList.remove('on'); }
    }
    flush();
  }

  // ---- 入力方式「タッチ」
  // iOS の WebKit は、ある指が離れるのと同じ瞬間に別の指が着くと touchstart を
  // 出さないことがある。そこで touchstart / touchend の通知は当てにせず、毎回
  // e.touches (いま画面に触れている指の一覧) と手元の状態を突き合わせる。
  function sync(e) {
    e.preventDefault();
    if (!cfg || cfg.input === 'pointer') return;
    var k, t, id, lane;
    var isStart = e.type === 'touchstart';
    if (cfg.debug && ws && ws.readyState === 1)   // 生イベントを丸ごと記録 (move も含む)
      ws.send('#' + e.type + ' changed=[' + fmt(e.changedTouches) + '] all=[' + fmt(e.touches) +
              '] t=' + performance.now().toFixed(1));
    var started = null;
    if (isStart) {
      started = new Set();
      for (k = 0; k < e.changedTouches.length; k++) {
        id = e.changedTouches[k].identifier;
        started.add(id);
        // 同じ ID の指がもう一度着いた (同じ場所の連打で ID が使い回される) → いったん離す
        if (touches.has(id)) { release(touches.get(id)); touches.delete(id); }
      }
    }
    var alive = new Map();
    for (k = 0; k < e.touches.length; k++) alive.set(e.touches[k].identifier, e.touches[k]);

    touches.forEach(function (ln, tid) {          // いなくなった指 → 離す
      if (!alive.has(tid)) {
        touches.delete(tid); release(ln);
        dbg(e.type === 'touchcancel' ? 'tc' : 'te', tid, ln, e.touches.length);
      }
    });
    alive.forEach(function (touch, tid) {
      lane = laneAt(touch.clientX);
      var old = touches.get(tid);
      if (old === undefined) {                    // 新しい指 → 押す
        touches.set(tid, lane);
        if (!(isStart && started.has(tid))) {     // touchstart が来なかった指を拾った
          rescued[lane]++;
          dbg('ts-missed(' + e.type + ')', tid, lane, e.touches.length);
        } else dbg('ts', tid, lane, e.touches.length);
        press(lane);
      } else if (cfg.slide && old !== lane) {     // 隣のレーンへ滑った
        touches.set(tid, lane); release(old); press(lane);
      }
    });
    flush();
  }
  var onStart = sync, onMove = sync, onEnd = sync;

  var opt = { passive: false, capture: true };
  document.addEventListener('touchstart', onStart, opt);
  document.addEventListener('touchmove', onMove, opt);
  document.addEventListener('touchend', onEnd, opt);
  document.addEventListener('touchcancel', onEnd, opt);
  // ---- 入力方式「ポインター」: Pointer Events で同じことをする
  function onPDown(e) {
    if (!cfg || cfg.input !== 'pointer') return;
    e.preventDefault();
    if (touches.has(e.pointerId)) release(touches.get(e.pointerId));
    var i = laneAt(e.clientX);
    dbg('pd', e.pointerId, i, touches.size + 1);
    touches.set(e.pointerId, i);
    press(i);
    flush();
  }
  function onPMove(e) {
    if (!cfg || cfg.input !== 'pointer' || !cfg.slide) return;
    var old = touches.get(e.pointerId);
    if (old === undefined) return;
    var i = laneAt(e.clientX);
    if (i !== old) { touches.set(e.pointerId, i); release(old); press(i); flush(); }
  }
  function onPUp(e) {
    if (!cfg || cfg.input !== 'pointer') return;
    var i = touches.get(e.pointerId);
    dbg(e.type === 'pointercancel' ? 'pc' : 'pu', e.pointerId, i, touches.size - 1);
    if (i === undefined) return;
    touches.delete(e.pointerId);
    release(i);
    flush();
  }
  document.addEventListener('pointerdown', onPDown, opt);
  document.addEventListener('pointermove', onPMove, opt);
  document.addEventListener('pointerup', onPUp, opt);
  document.addEventListener('pointercancel', onPUp, opt);

  // ブラウザ標準のジェスチャー類を全部止める
  ['gesturestart', 'gesturechange', 'gestureend', 'contextmenu', 'selectstart',
   'dblclick', 'click', 'dragstart', 'wheel'].forEach(function (n) {
    document.addEventListener(n, function (e) { e.preventDefault(); }, opt);
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) releaseAll();
  });
  window.addEventListener('pagehide', releaseAll);

  function build() {
    lanesEl.textContent = '';
    els = []; counts = []; seen = []; seenEls = []; rescued = [];
    cfg.keys.forEach(function (k) {
      var d = document.createElement('div');
      d.className = 'lane';
      d.appendChild(document.createTextNode(k.toUpperCase()));
      var c = document.createElement('small');
      c.textContent = '0';
      d.appendChild(c);
      lanesEl.appendChild(d);
      els.push(d); counts.push(0); seen.push(0); seenEls.push(c); rescued.push(0);
    });
    touches.clear();
  }

  function connect() {
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    ws.onmessage = function (m) {
      cfg = JSON.parse(m.data);
      build();
      statusEl.className = 'ok';
    };
    ws.onclose = function () {
      statusEl.className = '';
      statusEl.textContent = 'PC と未接続 — 再接続中…';
      if (cfg) releaseAll();
      setTimeout(connect, 500);
    };
    ws.onerror = function () { try { ws.close(); } catch (_) {} };
  }
  connect();
})();
</script>
</body>
</html>
